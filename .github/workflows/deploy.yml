name: Publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose:
        description: Describe the current ECS service without deploying
        required: false
        type: boolean
        default: false

concurrency:
  group: demo-bokeh-org-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bokeh/demo.bokeh.org
  ECS_CLUSTER: demo-bokeh-org
  ECS_SERVICE: worker
  ECS_CONTAINER: worker

jobs:
  publish-and-deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Require Arraylake access token
        env:
          ARRAYLAKE_API_TOKEN: ${{ secrets.ARRAYLAKE_API_TOKEN }}
        run: test -n "$ARRAYLAKE_API_TOKEN"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::562605262404:role/demo-bokeh-org-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: demo-${{ github.run_id }}
          allowed-account-ids: "562605262404"

      - name: Log in to Amazon ECR
        if: ${{ !inputs.diagnose }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ !inputs.diagnose }}
        uses: docker/setup-buildx-action@v3

      - name: Build or reuse immutable image
        if: ${{ !inputs.diagnose }}
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          image_tag="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          digest="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true
          )"
          if [[ "$digest" != sha256:* ]]; then
            cache_ref="$ECR_REGISTRY/$ECR_REPOSITORY:buildcache"
            docker buildx build \
              --platform linux/arm64 \
              --cache-from "type=registry,ref=$cache_ref" \
              --cache-to "type=registry,ref=$cache_ref,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true" \
              --output "type=image,name=$image_tag,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true" \
              .
            digest="$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="$IMAGE_TAG" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"
          fi
          test "${digest#sha256:}" != "$digest"
          image="$ECR_REGISTRY/$ECR_REPOSITORY@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Render ECS task definition
        if: ${{ !inputs.diagnose }}
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs-task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.image.outputs.image }}
          environment-variables: |
            ARRAYLAKE_API_TOKEN=${{ secrets.ARRAYLAKE_API_TOKEN }}

      - name: Deploy to ECS
        if: ${{ !inputs.diagnose }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE

      - name: Smoke test production
        if: ${{ !inputs.diagnose }}
        run: |
          for observation in {1..6}; do
            python scripts/smoke_production.py --attempts 1
            if [[ "$observation" != 6 ]]; then
              sleep 10
            fi
          done

      - name: Diagnose ECS service
        if: ${{ inputs.diagnose }}
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{taskDefinition:taskDefinition,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments[].{id:id,status:status,taskDefinition:taskDefinition,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,runningCount:runningCount,pendingCount:pendingCount,failedTasks:failedTasks},events:events[0:20].{createdAt:createdAt,message:message}}' \
            --output json

      - name: Report ECS deployment failure
        if: ${{ failure() && !inputs.diagnose }}
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{taskDefinition:taskDefinition,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments[].{id:id,status:status,taskDefinition:taskDefinition,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,runningCount:runningCount,pendingCount:pendingCount,failedTasks:failedTasks},events:events[0:20].{createdAt:createdAt,message:message}}' \
            --output json
          read -r -a stopped_tasks <<< "$(
            aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status STOPPED \
              --max-results 10 \
              --query 'taskArns' \
              --output text
          )"
          if [[ "${stopped_tasks[0]:-}" == arn:* ]]; then
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "${stopped_tasks[@]}" \
              --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,createdAt:createdAt,startedAt:startedAt,stoppedAt:stoppedAt,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
              --output json
          fi
