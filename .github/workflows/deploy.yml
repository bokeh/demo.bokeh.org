name: Publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demo-bokeh-org-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bokeh/demo.bokeh.org
  ECS_CLUSTER: demo-bokeh-org
  ECS_SERVICE: worker
  ECS_CONTAINER: worker

jobs:
  publish-and-deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Require Arraylake access token
        env:
          ARRAYLAKE_API_TOKEN: ${{ secrets.ARRAYLAKE_API_TOKEN }}
        run: test -n "$ARRAYLAKE_API_TOKEN"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::562605262404:role/demo-bokeh-org-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: demo-${{ github.run_id }}
          allowed-account-ids: "562605262404"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build or reuse immutable image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          image_tag="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          digest="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true
          )"
          if [[ "$digest" != sha256:* ]]; then
            docker buildx build --platform linux/arm64 --tag "$image_tag" --push .
            digest="$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="$IMAGE_TAG" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"
          fi
          test "${digest#sha256:}" != "$digest"
          image="$ECR_REGISTRY/$ECR_REPOSITORY@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Render ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs-task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.image.outputs.image }}
          environment-variables: |
            ARRAYLAKE_API_TOKEN=${{ secrets.ARRAYLAKE_API_TOKEN }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE

      - name: Smoke test production
        run: python scripts/smoke_production.py
