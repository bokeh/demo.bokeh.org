name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_GIL: "0"
      UV_PYTHON: 3.14t
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install dependencies
        run: uv sync --locked --python "$UV_PYTHON"
      - name: Verify free-threaded runtime
        run: >-
          uv run --locked python -c "import asgi, sys, sysconfig;
          assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1 and not sys._is_gil_enabled()"
      - name: Check Python code
        run: |
          uv run --locked ruff format --no-cache --check .
          uv run --locked ruff check --no-cache .
          uv run --locked pyright
      - name: Run tests
        run: uv run --locked pytest
      - name: Compile application
        run: uv run --locked python -m compileall -q asgi.py catalog.py presentation.py apps tests

  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Build container
        run: docker build --tag bokeh-demo:test .
      - name: Start container
        run: docker run --detach --read-only --name bokeh-demo --publish 5006:5006 bokeh-demo:test
      - name: Wait for container health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5006/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Show container logs after failure
        if: failure()
        run: docker logs bokeh-demo
      - name: Stop container
        if: always()
        run: docker rm --force bokeh-demo
