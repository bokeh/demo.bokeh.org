name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frameworks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework-demos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install browser test dependencies
        run: npm ci
      - name: Install browser
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify independently copied apps
        run: npm run test:standalone
      - name: Install framework dependencies
        run: npm run install:apps
      - name: Build static framework demos
        run: npm run build
      - name: Test framework demos
        run: npm test

  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_GIL: "0"
      UV_PYTHON: 3.14t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install dependencies
        run: uv sync --locked --python "$UV_PYTHON"
      - name: Verify free-threaded runtime
        run: >-
          uv run --locked python -c "import asgi, sys, sysconfig;
          assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1 and not sys._is_gil_enabled()"
      - name: Check Python code
        run: |
          uv run --locked ruff format --no-cache --check .
          uv run --locked ruff check --no-cache .
          uv run --locked pyright
      - name: Run tests
        run: uv run --locked pytest
      - name: Compile application
        run: uv run --locked python -m compileall -q asgi.py catalog.py presentation.py apps tests

  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container
        run: docker build --tag bokeh-demo:test .
      - name: Start container
        run: docker run --detach --read-only --name bokeh-demo --publish 5006:5006 bokeh-demo:test
      - name: Wait for container health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5006/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Show container logs after failure
        if: failure()
        run: docker logs bokeh-demo
      - name: Stop container
        if: always()
        run: docker rm --force bokeh-demo
